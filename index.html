<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAPERR</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="menu">
      <input
        type="text"
        id="player-name"
        placeholder="Имя игрока"
        maxlength="15"
        autocomplete="off"
      />
      <button id="reset-btn">Новая Игра</button>
      <div id="mines-counter">
        Флаги: <span id="counter-val">0</span>/<span id="max-mines"></span>
      </div>
      <button id="sound-btn" title="включить/выключить звук">🔊</button>
    </div>
    <div id="game-board"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
